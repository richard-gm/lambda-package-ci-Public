name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example v1.0.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must run from main."
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version must be a semantic version tag such as v1.0.0."
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::Tag already exists: $VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
